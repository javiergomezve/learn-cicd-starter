name: ci

on:
  push:
    branches:
      - "main"

jobs:
  test:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build
        run: scripts/buildprod.sh

      - name: GCP auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: "Use gcloud CLI"
        run: "gcloud info"

      - name: Build and Deploy
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-512022/notely-ar-repo/notely:latest .
