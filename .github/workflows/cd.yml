name: ci

on:
  push:
    branches:
      - "main"

jobs:
  test:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build
        run: scripts/buildprod.sh
